<div lang="sv" style="margin:0;background:#f4f7f5;color:#193139;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
      <td align="center" style="padding:28px 12px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#fff;border:1px solid #d9e6df;border-radius:16px;">
          <tr>
            <td style="padding:22px 28px;border-bottom:1px solid #d9e6df;">
              <div style="font-size:21px;font-weight:700;color:#0e2d38;">MittCSN</div>
              <div style="margin-top:4px;font-size:13px;color:#4b6567;">Fristående studielånekalkylator</div>
            </td>
          </tr>
          <tr>
            <td style="padding:26px 28px 30px;font-size:16px;line-height:1.6;">
              <h1 style="margin:0 0 12px;font-size:25px;line-height:1.25;color:#0e2d38;">{{subject}}</h1>
              <p style="margin:0 0 20px;">{{intro}}</p>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td bgcolor="#14604f" style="border-radius:8px;">
                    <a href="{{action_url}}" style="display:inline-block;padding:12px 20px;color:#fff;font-weight:700;text-decoration:none;">{{action_label}}</a>
                  </td>
                </tr>
              </table>
              <p style="margin:18px 0 0;">Länken kan användas en gång och gäller i <strong>{{expires_in}}</strong>.</p>
              <p style="margin:18px 0 0;font-size:14px;color:#4b6567;">Om knappen inte fungerar, kopiera länken:</p>
              <p style="margin:4px 0 0;font-size:14px;overflow-wrap:anywhere;word-break:break-all;">
                <a href="{{action_url}}" style="color:#14604f;">{{action_url}}</a>
              </p>
              <p style="margin:22px 0 0;font-size:14px;color:#4b6567;">Om du inte begärde det här mejlet kan du ignorera det.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
